<!doctype html>
<html lang="mn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Будгийн чавх</title>
<style>
:root{
  --ink:#141A2E; --paper:#FBFAF7; --panel:#F2EFE8; --rule:#DCD6C8;
  --deep:#D9367A; --ok:#0B7A55; --ok-soft:#DFF1EC; --no:#C0322B; --no-soft:#FBE7DC;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#1b2440;color:#fff;overflow:hidden;
  font-family:"Golos Text",-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:crosshair}
.hud{position:fixed;top:12px;display:flex;gap:8px;flex-wrap:wrap;pointer-events:none;z-index:3}
#hudL{left:12px} #hudR{right:12px;justify-content:flex-end}
.pill{background:rgba(20,26,46,.62);border-radius:10px;padding:6px 12px;font-weight:800;
  font-size:clamp(13px,1.5vw,18px);line-height:1.15;display:flex;flex-direction:column;min-width:60px}
.pill small{font-size:.62em;opacity:.8;letter-spacing:.06em}
.hud button{pointer-events:auto;font:inherit;font-weight:800;font-size:clamp(14px,1.6vw,19px);
  background:rgba(20,26,46,.62);color:#fff;border:0;border-radius:10px;padding:0 12px;cursor:pointer}
.hud button:focus-visible{outline:3px solid #fff}
#banner{position:fixed;left:50%;top:clamp(64px,9vh,90px);transform:translateX(-50%);z-index:3;pointer-events:none;
  width:min(760px,calc(100vw - 24px));text-align:center;display:none}
#banner.show{display:block}
#banner .q{background:rgba(255,255,255,.95);color:var(--ink);border:3px solid var(--ink);border-radius:14px;
  padding:10px 16px 12px;box-shadow:5px 5px 0 rgba(20,26,46,.45)}
#banner .qt{font-weight:800;font-size:clamp(16px,2vw,25px);line-height:1.25}
#banner .lanes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
#banner .ln{border-radius:10px;padding:6px 8px;font-weight:800;font-size:clamp(12px,1.5vw,18px);color:#fff;line-height:1.2}
#banner .ln b{display:block;font-size:.85em;opacity:.95}
#toast{position:fixed;left:50%;top:46%;transform:translate(-50%,-50%) scale(.9);opacity:0;z-index:4;
  font-weight:900;font-size:clamp(26px,4.6vw,58px);transition:opacity .2s,transform .2s;pointer-events:none;
  text-shadow:3px 3px 0 rgba(20,26,46,.6);white-space:nowrap}
#toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
#help{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);z-index:3;pointer-events:none;
  background:rgba(20,26,46,.55);padding:6px 14px;border-radius:10px;font-size:clamp(12px,1.3vw,15px);
  white-space:nowrap;max-width:calc(100vw - 24px);overflow:hidden;text-overflow:ellipsis}
#modal{position:fixed;inset:0;z-index:10;display:none;align-items:center;justify-content:center;
  background:rgba(20,26,46,.5);padding:16px;overflow:auto}
#modal.show{display:flex}
.card:focus{outline:none}
.card{background:var(--paper);color:var(--ink);width:min(680px,100%);max-height:100%;overflow:auto;
  border:4px solid var(--ink);border-radius:14px;box-shadow:8px 8px 0 rgba(217,54,122,.55);
  padding:22px 24px;font-size:clamp(16px,1.6vw,21px);line-height:1.45;user-select:text}
.tag{display:inline-block;font-size:.68em;font-weight:800;letter-spacing:.1em;text-transform:uppercase;
  background:var(--deep);color:#fff;border:2px solid var(--ink);border-radius:2em;padding:.12em .8em}
.card h1{font-size:1.75em;line-height:1.15;margin:.45em 0 .3em}
.card h2{font-size:1.25em;line-height:1.3;margin:.55em 0 .2em}
.card p{margin:.4em 0}
.muted{color:#5C6278;font-size:.9em}
.verdict{font-weight:900;font-size:1.5em;margin:.3em 0}
.verdict.ok{color:var(--ok)} .verdict.no{color:var(--no)}
.ans{border:2.5px solid var(--ok);background:var(--ok-soft);border-radius:.6em;padding:.5em .8em;font-weight:700;margin:.5em 0}
.ans.bad{border-color:var(--no);background:var(--no-soft)}
.why{margin-top:.7em;padding:.7em .9em;border-left:5px solid var(--deep);background:var(--panel);border-radius:0 .5em .5em 0}
.row{display:flex;gap:.6em;flex-wrap:wrap;align-items:center;margin-top:1em}
.btn{font:inherit;font-weight:800;background:var(--ink);color:#fff;border:2.5px solid var(--ink);
  border-radius:2em;padding:.5em 1.4em;cursor:pointer}
.btn.alt{background:transparent;color:var(--ink)}
.btn:focus-visible{outline:3px solid var(--deep);outline-offset:2px}
.keys{display:grid;grid-template-columns:auto 1fr;gap:.35em .9em;margin:.8em 0;font-size:.92em}
.keys b{background:var(--panel);border:2px solid var(--rule);border-radius:.35em;padding:0 .45em;white-space:nowrap}
.stars{font-size:2.6em;letter-spacing:.1em;line-height:1;margin:.2em 0;color:#E0A800}
.stars .off{color:#D6D0C2}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:.5em;margin:.6em 0}
.stats div{background:var(--panel);border-radius:.5em;padding:.4em .6em;font-weight:800;font-size:1.05em}
.stats small{display:block;font-weight:600;font-size:.7em;color:#5C6278}
.review{margin-top:.8em;display:grid;gap:.55em}
.review div{border:2px solid var(--rule);border-radius:.55em;padding:.5em .75em;font-size:.88em}
.review b{display:block}
.review .a{color:var(--ok);font-weight:700}
.poster{display:block;margin:.6em auto;max-width:220px;width:60%;border-radius:8px;border:3px solid var(--ink)}
@media (max-width:520px){.stats{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<canvas id="c" aria-label="Чавхны тоглоомын талбар"></canvas>
<div class="hud" id="hudL">
  <div class="pill"><small>ОНОО</small><span id="hScore">0</span></div>
  <div class="pill"><small>АСУУЛТ</small><span id="hQ">0/12</span></div>
  <div class="pill"><small>ЗӨВ</small><span id="hOk">✓ 0</span></div>
  <div class="pill"><small>БӨМБӨЛӨГ</small><span id="hShots">● ● ●</span></div>
</div>
<div class="hud" id="hudR">
  <button id="bPause" type="button" aria-label="Түр зогсоох">⏸</button>
  <button id="bMute" type="button" aria-label="Дуу унтраах">🔊</button>
  <button id="bFull" type="button" aria-label="Бүтэн дэлгэц">⛶</button>
</div>
<div id="banner"></div>
<div id="toast"></div>
<div id="help">Хулганаар чирж татаад тавь · ← → өнцөг, ↑ ↓ хүч, Space — харвах · P — түр зогсоох</div>
<div id="modal" role="dialog" aria-modal="true"><div class="card" id="card" tabindex="-1"></div></div>

<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);

/* ───────────── Асуултууд (5-р анги · Хичээл 14: Постер, визуал шатлал) ───────────── */
const QUESTIONS = [
  {q:'Постер дээр нүд юуг ХАМГИЙН ТҮРҮҮНД хардаг вэ?', opts:['Хамгийн том, тод, дээд талын элемент','Хамгийн олон үгтэй хэсэг','Доод булангийн жижиг текст'], ans:0,
   why:'Нүд хамгийн ТОМ, хамгийн ТОД, хамгийн ДЭЭД зүйлийг эхэлж хардаг. Тиймээс гол зурвасаа яг тэнд байрлуулна.'},
  {q:'Визуал шатлалын 3 хэрэгсэл аль нь вэ?', opts:['Хэмжээ · өнгө ба тодосгогч · байрлал','Файлын нэр · файлын хэмжээ · огноо','Фонтын нэр · үгийн тоо · хуудасны тоо'], ans:0,
   why:'Шатлалыг хэмжээ, өнгө/тодосгогч, байрлал ба зай гурваар байгуулна. Файлын нэр, МБ хэмжээ харагдацад нөлөөлөхгүй.'},
  {q:'Аль хослол ХАМГИЙН САЙН уншигдах вэ?', opts:['Цайвар дэвсгэр + бараан үсэг','Цайвар шар дэвсгэр + цагаан үсэг','Хөх дэвсгэр + ягаан үсэг'], ans:0,
   why:'Тодосгогч өндөр байх тусам уншигдац сайн. Ойролцоо өнгө хоорондоо «уусдаг».'},
  {q:'«Тодосгогч» (contrast) гэж юу вэ?', opts:['Хоёр зүйлийн хоорондын ялгаа','Зургийн файлын хэмжээ','Фонтын нэр'], ans:0,
   why:'Contrast — хоёр зүйлийн ялгаа. Цайвар дэвсгэр дээр бараан үсэг хамгийн сайн уншигддаг.'},
  {q:'Гарчиг : дэд гарчиг : тайлбарын хэмжээний харьцаа ямар байх вэ?', opts:['3 : 2 : 1','1 : 1 : 1','1 : 2 : 3'], ans:0,
   why:'Гарчиг — хамгийн том, дэд гарчиг — дунд, тайлбар — жижиг. Харьцаа 3 : 2 : 1.'},
  {q:'Нэг постерт хэдэн өнгө хэрэглэх нь зөв вэ?', opts:['2-3 өнгө','5-6 өнгө','10-аас олон өнгө'], ans:0,
   why:'2-3 өнгөнөөс хэтрүүлэхгүй. 5-6 өнгө хольж хэрэглэх нь түгээмэл алдаа.'},
  {q:'Нүд постерыг ихэвчлэн хаанаас уншиж эхэлдэг вэ?', opts:['Зүүн дээд талаас','Баруун доод булангаас','Голоос нь доошоо'], ans:0,
   why:'Нүд зүүн дээрээс эхэлдэг. Чухал зүйлийг дээд талд тавь; эргэн тойрны хоосон зай түүнийг тодруулна.'},
  {q:'Загвар (template)-ыг ашиглах хамгийн ухаалаг арга аль нь вэ?', opts:['Байрлалыг үлдээж, агуулгыг солих','Байрлалыг бүрэн эвдэж шинээр хийх','Загварын бүх текстийг хэвээр үлдээх'], ans:0,
   why:'«Байрлалыг үлдээ, агуулгыг соль». Байрлалыг эвдвэл мэргэжлийн дизайны давуу тал алдагдана.'},
  {q:'Canva-д загвар дээр постер бүтээх ЭХНИЙ алхам аль нь вэ?', opts:['Хэмжээ, загвараа сонгох','Зургийг солих','Доод мөрөнд эх сурвалж бичих'], ans:0,
   why:'Дараалал: хэмжээ, загвар сонгох → гарчгийг солих → хэрэггүй элементийг устгаж зай гаргах → зургийг лиценз шалгасан зургаар солих.'},
  {q:'Постерын гол зурвас хэдэн үгтэй байх нь зөв вэ?', opts:['6-аас цөөн үг','20-30 үг','50-аас олон үг'], ans:0,
   why:'Хүн коридороор өнгөрөхдөө 4-5 секунд л хардаг. Гол зурвасаа 6-аас цөөн үгээр бич.'},
  {q:'«3 метрийн шалгуур» юуг шалгадаг вэ?', opts:['Гол зурвас 5 секундэд ойлгогдох эсэх','Зургийн чанар сайн эсэх','Фонтын нэр зөв эсэх'], ans:0,
   why:'3 метр ухарч 5 секунд хараад «гол зурвас нь юу байв?» гэж асууна. Хариулж чадвал постер ажиллаж байна.'},
  {q:'3 метрийн шалгуурт гол зурвас ойлгогдохгүй бол юу хийх вэ?', opts:['Гарчгаа томсгож, текстээ цөөлнө','Илүү олон текст нэмнэ','Илүү олон өнгө нэмнэ'], ans:0,
   why:'Дизайн бол гоо сайхан биш — ОЙЛГОМЖТОЙ БАЙДАЛ. Гарчгаа томсгож, текстээ цөөл.'}
];

/* ───────────── Дуу ───────────── */
let AC = null, muted = false;
function tone(f, dur, type='square', vol=.05, f2=0, delay=0){
  if (muted) return;
  try{
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state === 'suspended') AC.resume();
    const t = AC.currentTime + delay, o = AC.createOscillator(), g = AC.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t);
    if (f2) o.frequency.linearRampToValueAtTime(f2, t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + dur + .02);
  }catch(e){}
}
const SFX = {
  stretch:()=>tone(220,.12,'triangle',.05,330),
  launch:()=>tone(300,.25,'sine',.09,900),
  splat:()=>{tone(160,.18,'sawtooth',.07,60);tone(900,.12,'triangle',.05,300,.02);},
  crash:()=>[0,1,2].forEach(i=>tone(140+i*40,.1,'square',.05,80,i*.06)),
  miss:()=>tone(240,.2,'triangle',.06,120),
  right:()=>[659,784,988,1319].forEach((f,i)=>tone(f,.14,'triangle',.08,0,i*.08)),
  wrong:()=>{tone(300,.18,'sawtooth',.04);tone(220,.35,'sawtooth',.04,0,.18);},
  win:()=>[523,659,784,1047,784,1047,1319].forEach((f,i)=>tone(f,.2,'triangle',.08,0,i*.12))
};

/* ───────────── Канвас ───────────── */
const W = 1280, H = 720, GROUND = 640;
const canvas = $('c'), ctx = canvas.getContext('2d');
let scale = 1, offX = 0, offY = 0, dpr = 1;
function resize(){
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  const cw = window.innerWidth, ch = window.innerHeight;
  canvas.width = Math.round(cw * dpr); canvas.height = Math.round(ch * dpr);
  scale = Math.min(cw / W, ch / H); offX = (cw - W*scale) / 2; offY = (ch - H*scale) / 2;
}
window.addEventListener('resize', resize); resize();
const toWorld = (cx, cy) => ({x:(cx - offX) / scale, y:(cy - offY) / scale});

/* ───────────── Тогтмол ба төлөв ───────────── */
const SLING = {x:230, y:500};
const MAXPULL = 150, VMAX = 1180, G = 900, BALL_R = 17;
const TOWER_X = [770, 960, 1150];
const TCOL = ['#1e6fd9','#e8541c','#7c3aed'];
const BALL_COL = ['#e0384a','#1e6fd9','#f5b700'];
const STEP = 1/120;

let seed = 14;
const rnd = () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };

let state = 'start', qi = 0, shots = 3, score = 0, tHit = 0, hitTower = -1, totalShots = 0;
let answers = new Array(QUESTIONS.length).fill(null);
let towers = [], order = [0,1,2], ball = null, aim = {angle:40, power:.75}, dragging = null, parts = [], debris = [];
let painted = new Array(QUESTIONS.length).fill(0); // 0 хоосон, 1 будсан, -1 алдсан
let acc = 0;

function buildLevel(){
  const q = QUESTIONS[qi];
  order = [0,1,2]; for (let i=2;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [order[i],order[j]] = [order[j],order[i]]; }
  seed = 100 + qi * 7;
  towers = TOWER_X.map((x, i) => {
    const n = 2 + Math.floor(rnd() * 4);   // 2-5 давхар
    const blocks = [];
    let y = GROUND;
    for (let k=0;k<n;k++){
      const vertical = k % 2 === 0;
      const w = vertical ? 74 : 92, h = vertical ? 46 : 22;
      blocks.push({x:x - w/2, y:y - h, w, h, vx:0, vy:0, rot:0, vr:0, dyn:false, kind:vertical ? 'crate' : 'plank'});
      y -= h;
    }
    const target = {x, y:y - 38, r:36, vx:0, vy:0, dyn:false, rot:0, vr:0};
    return {i, x, blocks, target, letter:'ABC'[i], opt:order[i], hit:false};
  });
  shots = 3; ball = null; hitTower = -1;
  updateHud(); showBanner();
}
function showBanner(){
  const q = QUESTIONS[qi];
  $('banner').innerHTML = `<div class="q"><div class="qt">🎯 ${esc(q.q)}</div><div class="lanes">${towers.map(t=>`<div class="ln" style="background:${TCOL[t.i]}"><b>${t.letter}</b>${esc(q.opts[t.opt])}</div>`).join('')}</div></div>`;
  $('banner').classList.add('show');
}
function updateHud(){
  $('hScore').textContent = score;
  $('hQ').textContent = answers.filter(a=>a!==null).length + '/' + QUESTIONS.length;
  $('hOk').textContent = '✓ ' + answers.filter(a=>a===true).length;
  $('hShots').textContent = [0,1,2].map(i => i < shots ? '●' : '○').join(' ');
}
let toastT = null;
function toast(msg, color='#fff'){
  const el = $('toast'); el.textContent = msg; el.style.color = color; el.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(()=>el.classList.remove('show'), 1000);
}
const esc = s => String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ───────────── Физик ───────────── */
function launchVel(angle, power){
  const a = angle * Math.PI / 180, v = VMAX * Math.max(.15, Math.min(1, power));
  return {vx:Math.cos(a) * v, vy:-Math.sin(a) * v};
}
function ballStart(angle, power){
  const a = angle * Math.PI / 180, pull = MAXPULL * Math.max(.15, Math.min(1, power));
  return {x:SLING.x - Math.cos(a) * pull * .35, y:SLING.y + Math.sin(a) * pull * .35};
}
function hitTest(x, y, list){
  for (const t of list){
    if (t.hit) continue;
    const tg = t.target;
    if (Math.hypot(x - tg.x, y - tg.y) < tg.r + BALL_R) return t.i;
    for (const b of t.blocks){
      const cx = Math.max(b.x, Math.min(x, b.x + b.w)), cy = Math.max(b.y, Math.min(y, b.y + b.h));
      if (Math.hypot(x - cx, y - cy) < BALL_R) return t.i;
    }
  }
  return -1;
}
// нэг алхам: 'fly' | tower index | 'miss'
function stepBall(b, list){
  b.vy += G * STEP; b.x += b.vx * STEP; b.y += b.vy * STEP; b.t += STEP;
  const h = hitTest(b.x, b.y, list);
  if (h >= 0) return h;
  if (b.y + BALL_R >= GROUND || b.x > W + 60 || b.x < -60 || b.t > 5) return 'miss';
  return 'fly';
}
function simulate(angle, power){
  const s = ballStart(angle, power), v = launchVel(angle, power);
  const b = {x:s.x, y:s.y, vx:v.vx, vy:v.vy, t:0};
  const path = [];
  for (let i=0;i<1200;i++){
    const r = stepBall(b, towers);
    if (i % 6 === 0) path.push({x:b.x, y:b.y});
    if (r !== 'fly') return {result:r, path};
  }
  return {result:'miss', path};
}

function fire(angle, power){
  if (state !== 'aim' || shots <= 0) return false;
  const s = ballStart(angle, power), v = launchVel(angle, power);
  ball = {x:s.x, y:s.y, vx:v.vx, vy:v.vy, t:0, col:BALL_COL[(3 - shots) % 3], trail:[]};
  shots--; totalShots++; state = 'fly'; SFX.launch(); updateHud();
  return true;
}
function knockTower(t, vx, vy){
  t.hit = true;
  const all = t.blocks.concat([t.target]);
  all.forEach((b, k) => {
    b.dyn = true;
    b.vx = vx * (.25 + rnd()*.25) + (rnd() - .3) * 120;
    b.vy = -200 - rnd() * 260 - k * 30;
    b.vr = (rnd() - .5) * 8;
  });
}
function splash(x, y, col, n=26){
  for (let i=0;i<n;i++){ const a = rnd()*Math.PI*2, s = 120 + rnd()*380;
    parts.push({x, y, vx:Math.cos(a)*s, vy:Math.sin(a)*s - 120, r:4 + rnd()*7, col, life:1.2 + rnd()*.6}); }
}
function update(dt){
  if (state === 'paused' || state === 'modal' || state === 'start' || state === 'done') return;
  acc += dt;
  while (acc >= STEP){
    acc -= STEP;
    if (state === 'fly' && ball){
      ball.trail.push({x:ball.x, y:ball.y}); if (ball.trail.length > 40) ball.trail.shift();
      const r = stepBall(ball, towers);
      if (r === 'miss'){
        splash(ball.x, Math.min(ball.y, GROUND - 4), ball.col, 12); SFX.miss();
        ball = null;
        if (shots > 0){ state = 'aim'; toast('Алдлаа! Дахин оролд', '#fff'); }
        else { state = 'hit'; hitTower = -1; tHit = .7; }
      } else if (typeof r === 'number'){
        const t = towers[r];
        knockTower(t, ball.vx, ball.vy); splash(ball.x, ball.y, ball.col, 34); SFX.splat(); SFX.crash();
        ball = null; state = 'hit'; hitTower = r; tHit = 1.0;
      }
    }
    // унах хэсгүүд
    for (const t of towers) for (const b of t.blocks.concat([t.target])){
      if (!b.dyn) continue;
      b.vy += G * STEP; b.x += b.vx * STEP; b.y += b.vy * STEP; b.rot += b.vr * STEP;
      const bottom = b.r ? b.y + b.r : b.y + b.h;
      if (bottom > GROUND){ if (b.r) b.y = GROUND - b.r; else b.y = GROUND - b.h; b.vy *= -.3; b.vx *= .7; b.vr *= .6; }
    }
    for (const p of parts){ p.vy += G * .8 * STEP; p.x += p.vx * STEP; p.y += p.vy * STEP; p.life -= STEP; if (p.y > GROUND){ p.y = GROUND; p.vy = 0; p.vx *= .8; } }
    if (state === 'hit'){ tHit -= STEP; if (tHit <= 0){ resolveLevel(); return; } }
  }
  parts = parts.filter(p => p.life > 0);
}
function resolveLevel(){
  const q = QUESTIONS[qi];
  const chosen = hitTower >= 0 ? towers[hitTower].opt : -1;
  const ok = chosen === q.ans;
  answers[qi] = ok; painted[qi] = ok ? 1 : -1;
  const pts = ok ? (shots + 1) * 100 : 0; score += pts;
  ok ? SFX.right() : SFX.wrong();
  updateHud();
  state = 'modal'; $('banner').classList.remove('show');
  openModal(`<span class="tag">Асуулт ${qi+1} / ${QUESTIONS.length}</span>
    <h2>${esc(q.q)}</h2>
    <p class="verdict ${ok?'ok':'no'}">${ok ? '🎨 Зөв! +' + pts + ' оноо' : chosen < 0 ? '○ Бөмбөлөг дууслаа' : '✕ Буруу цамхаг'}</p>
    ${ok || chosen < 0 ? '' : `<div class="ans bad">Чиний онож: ${esc(q.opts[chosen])}</div>`}
    <div class="ans">✓ Зөв хариулт: ${esc(q.opts[q.ans])}</div>
    <div class="why">💡 ${esc(q.why)}</div>
    <p class="muted">${ok ? 'Постерын нэг хэсэг будагдлаа!' : 'Постерын энэ хэсэг саарал үлдлээ.'}</p>
    <div class="row"><button class="btn go" type="button">${qi + 1 < QUESTIONS.length ? 'Дараагийн асуулт ▶' : 'Постерыг харах 🖼'}</button><span class="muted">Space / Enter</span></div>`);
  const go = card.querySelector('.go'); go.focus();
  go.onclick = () => {
    closeModal();
    if (qi + 1 >= QUESTIONS.length){ finishGame(); return; }

  };
  modalKey = e => { if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); go.click(); } };
}

function roundRect(x, y, w, h, r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function drawBg(){

  ctx.fillStyle = '#9fd77a'; ctx.beginPath(); ctx.ellipse(380, GROUND, 420, 120, 0, Math.PI, 0); ctx.fill();
  ctx.fillStyle = '#8acb68'; ctx.beginPath(); ctx.ellipse(1000, GROUND, 480, 150, 0, Math.PI, 0); ctx.fill();
  ctx.fillStyle = '#6fb84f'; ctx.fillRect(0, GROUND, W, H - GROUND);

}

  };

function drawSling(back){

    ctx.beginPath(); ctx.moveTo(x, GROUND); ctx.lineTo(x, y + 60); ctx.lineTo(x - 22, y + 6); ctx.stroke();

function pouchPos(){
  if (state !== 'aim') return {x:SLING.x, y:SLING.y};

}
function drawBall(x, y, col, look=1){
  ctx.fillStyle = 'rgba(0,0,0,.18)'; ctx.beginPath(); ctx.ellipse(x, GROUND + 2, 14, 4, 0, 0, 7); ctx.fill();

function render(){

  ctx.fillText('Миний постер: ' + painted.filter(p=>p===1).length + ' / ' + QUESTIONS.length, POSTER.x + POSTER.w/2, POSTER.y + POSTER.h + 30);

    ctx.strokeStyle = '#3a1f0e'; ctx.lineWidth = 6;

let last = performance.now();
function loop(now){

  keyAim(dt);

}

/* ───────────── Оролт ───────────── */
function setAimFromDrag(p){
  const dx = dragging.x - p.x, dy = p.y - dragging.y;   // хойш, доош татахад урагш, дээш нисэнэ
  const len = Math.hypot(dx, dy);
  if (len < 8) return;
  aim.angle = Math.max(-10, Math.min(85, Math.atan2(dy, dx) * 180 / Math.PI));
  aim.power = Math.max(.15, Math.min(1, len / MAXPULL));
}
canvas.addEventListener('pointerdown', e => {
  if (state !== 'aim') return;
  const p = toWorld(e.clientX, e.clientY);
  dragging = {x:p.x, y:p.y, moved:false}; canvas.setPointerCapture(e.pointerId); SFX.stretch();
});
canvas.addEventListener('pointermove', e => {
  if (!dragging || state !== 'aim') return;
  const p = toWorld(e.clientX, e.clientY);
  if (Math.hypot(p.x - dragging.x, p.y - dragging.y) > 8) dragging.moved = true;
  setAimFromDrag(p);
});
const endDrag = () => {
  if (!dragging) return;
  const moved = dragging.moved; dragging = null;
  if (moved && state === 'aim') fire(aim.angle, aim.power);
};
canvas.addEventListener('pointerup', endDrag); canvas.addEventListener('pointercancel', () => { dragging = null; });
const held = {};
function keyAim(dt){
  if (state !== 'aim') return;
  if (held.ArrowLeft) aim.angle = Math.min(85, aim.angle + 30*dt);
  if (held.ArrowRight) aim.angle = Math.max(-10, aim.angle - 30*dt);
  if (held.ArrowUp) aim.power = Math.min(1, aim.power + .35*dt);
  if (held.ArrowDown) aim.power = Math.max(.15, aim.power - .35*dt);
}
document.addEventListener('keydown', e => {
  if (modal.classList.contains('show')){ if (e.code === 'Space') e.preventDefault(); if (modalKey) modalKey(e); return; }
  if (e.code === 'KeyP' || e.code === 'Escape'){ showPause(); return; }
  if (e.code === 'KeyM'){ toggleMute(); return; }
  if (['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.code)){ e.preventDefault(); held[e.code] = true; }
  if (e.code === 'Space' || e.code === 'Enter'){ e.preventDefault(); if (!e.repeat) fire(aim.angle, aim.power); }
});
document.addEventListener('keyup', e => { held[e.code] = false; });
window.addEventListener('blur', () => { for (const k in held) held[k] = false; });

function toggleMute(){ muted = !muted; $('bMute').textContent = muted ? '🔇' : '🔊'; }
$('bMute').onclick = e => { toggleMute(); e.currentTarget.blur(); };
$('bPause').onclick = e => { e.currentTarget.blur(); showPause(); };
$('bFull').onclick = e => {
  e.currentTarget.blur();
  try {
    const d = document, el = d.documentElement;
    if (!(d.fullscreenElement || d.webkitFullscreenElement)) (el.requestFullscreen || el.webkitRequestFullscreen).call(el);
    else (d.exitFullscreen || d.webkitExitFullscreen).call(d);
  } catch(err){}
};
document.addEventListener('visibilitychange', () => { if (document.hidden) showPause(); });

resetAll();
showStart();
requestAnimationFrame(loop);
window.__game = {
  update, render, fire, simulate,
  get state(){ return state; }, set state(v){ state = v; },
  get towers(){ return towers; }, get qi(){ return qi; }, get shots(){ return shots; },
  answers:()=>answers, score:()=>score, QUESTIONS
};
})();
</script>
</body>
