<!doctype html>
<html lang="mn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Блок-схем зурагч</title>
<meta name="description" content="4-р анги · Хичээл 12 · Flowgorithm маягийн блок-схем зурах, ажиллуулах хэрэгсэл">
<style>
:root{
  --paper:#F4F5F7; --panel:#FFFFFF; --rule:#D5D9E0; --ink:#1F2430; --ink-soft:#5C6278;
  --deep:#2F6FD6; --ok:#0B7A55; --ok-soft:#DFF1EC; --warn-soft:#FFF1D6; --no:#C0322B; --no-soft:#FBE7DC;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;font-size:15px;line-height:1.4}
button,input,select{font:inherit;color:inherit}
.app{display:flex;flex-direction:column;min-height:100vh}
header.top{display:flex;align-items:center;gap:.8rem;flex-wrap:wrap;padding:.55rem 14px;background:#2B3445;color:#fff}
header.top h1{font-size:1.05rem;margin:0;font-weight:800;white-space:nowrap}
header.top small{opacity:.7;font-weight:600}
header.top .sp{flex:1}
header.top input{border:0;border-radius:6px;padding:.32rem .55rem;font-weight:600;width:13rem;max-width:42vw;color:#1F2430}
.tb{display:flex;align-items:center;gap:.35rem;flex-wrap:wrap;padding:.45rem 14px;background:#E7EAEF;border-bottom:1px solid var(--rule)}
.tb .sep{width:1px;height:26px;background:#C3C8D2;margin:0 .25rem}
.tb .sp{flex:1}
.b{display:inline-flex;align-items:center;gap:.35rem;border:1px solid #B9C0CC;background:#fff;border-radius:6px;padding:.3rem .65rem;cursor:pointer;font-weight:600;white-space:nowrap}
.b:hover{border-color:#6B7385;background:#F8F9FB}
.b:focus-visible{outline:3px solid var(--deep);outline-offset:1px}
.b.pri{background:#2F6FD6;border-color:#2F6FD6;color:#fff}
.b.run{background:#1E9E5A;border-color:#1E9E5A;color:#fff}
.b.stop{background:#C0322B;border-color:#C0322B;color:#fff}
.b[disabled]{opacity:.4;cursor:default}
select{border:1px solid #B9C0CC;border-radius:6px;padding:.3rem .4rem;background:#fff;font-weight:600}
.main{flex:1;display:grid;grid-template-columns:minmax(0,1fr) 20rem;min-height:0}
@media (max-width:900px){.main{grid-template-columns:1fr}}
.chartWrap{position:relative;overflow:auto;background:#fff;background-image:radial-gradient(#E3E6EC 1px,transparent 1px);background-size:16px 16px;min-height:60vh}
#chart{display:block;margin:0 auto}
.side{border-left:1px solid var(--rule);background:var(--panel);display:flex;flex-direction:column;min-height:0}
@media (max-width:900px){.side{border-left:0;border-top:1px solid var(--rule)}}
.side h2{font-size:.82rem;letter-spacing:.06em;text-transform:uppercase;margin:0;padding:.55rem .8rem;background:#F0F2F5;border-bottom:1px solid var(--rule);color:#3B4254}
.console{flex:1;min-height:12rem;overflow:auto;padding:.7rem;display:flex;flex-direction:column;gap:.45rem;background:#FAFBFC}
.bub{max-width:88%;padding:.4rem .7rem;border-radius:12px;font-weight:600;word-wrap:break-word}
.bub.out{align-self:flex-start;background:#E4F6E0;border:1px solid #9FD49A}
.bub.in{align-self:flex-end;background:#DCEBFF;border:1px solid #9CBEF0}
.bub.sys{align-self:center;background:transparent;color:var(--ink-soft);font-size:.82rem;font-weight:600;text-align:center}
.cin{display:none;gap:.4rem;padding:.5rem;border-top:1px solid var(--rule);background:#fff}
.cin.show{display:flex}
.cin input{flex:1;min-width:0;border:2px solid #2F6FD6;border-radius:6px;padding:.35rem .5rem}
.vars{max-height:11rem;overflow:auto;border-top:1px solid var(--rule)}
.vars table{width:100%;border-collapse:collapse;font-size:.88rem}
.vars td,.vars th{padding:.3rem .7rem;border-bottom:1px solid #EEF0F3;text-align:left}
.vars th{font-size:.72rem;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.05em}
.runbar{display:none;align-items:center;gap:.4rem;flex-wrap:wrap;padding:.45rem 14px;background:#FFF4D9;border-bottom:1px solid #F0C36D;font-weight:700}
.runbar.show{display:flex}
.runbar .msg{flex:1 1 16rem}
.selbar{position:sticky;top:8px;left:0;z-index:4;display:none;gap:.3rem;margin:8px;width:max-content;background:#fff;border:1px solid #B9C0CC;border-radius:8px;padding:.3rem;box-shadow:0 4px 14px rgba(0,0,0,.12)}
.selbar.show{display:flex}
.hintbar{padding:.4rem 14px;font-size:.85rem;color:var(--ink-soft);background:#fff;border-bottom:1px solid var(--rule)}
.hintbar b{color:var(--ink)}
/* шинэ блокийн цэс */
.palette{position:fixed;z-index:20;display:none;background:#fff;border:1px solid #9AA2B1;border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.22);padding:.55rem;width:21rem}
.palette.show{display:block}
.palette h3{margin:.1rem .2rem .45rem;font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-soft)}
.palette .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:.35rem}
.palette button{display:flex;flex-direction:column;align-items:center;gap:.25rem;border:1px solid #D5D9E0;background:#fff;border-radius:8px;padding:.4rem .2rem;cursor:pointer;font-size:.78rem;font-weight:700}
.palette button:hover{border-color:#2F6FD6;background:#F2F7FF}
.palette button:focus-visible{outline:3px solid var(--deep)}
.palette .grp{grid-column:1/-1;font-size:.7rem;color:var(--ink-soft);font-weight:700;margin-top:.2rem}
/* засах цонх */
.dlg{position:fixed;inset:0;z-index:30;display:none;align-items:center;justify-content:center;background:rgba(20,26,40,.45);padding:16px}
.dlg.show{display:flex}
.dlg .box{background:#fff;border-radius:12px;width:min(30rem,100%);box-shadow:0 18px 50px rgba(0,0,0,.3);overflow:hidden}
.dlg .hd{display:flex;align-items:center;gap:.6rem;padding:.7rem 1rem;font-weight:800;border-bottom:1px solid var(--rule)}
.dlg .bd{padding:.9rem 1rem}
.dlg label{display:block;font-size:.8rem;font-weight:700;color:var(--ink-soft);margin-bottom:.3rem}
.dlg input{width:100%;border:2px solid #B9C0CC;border-radius:8px;padding:.5rem .6rem;font-size:1.05rem;font-weight:600}
.dlg input:focus{border-color:#2F6FD6;outline:none}
.dlg .help{font-size:.88rem;color:var(--ink-soft);margin:.6rem 0 0}
.dlg .ex{display:flex;flex-wrap:wrap;gap:.3rem;margin-top:.5rem}
.dlg .ex button{border:1px dashed #9AA2B1;background:#F8F9FB;border-radius:6px;padding:.15rem .5rem;font-size:.82rem;cursor:pointer}
.dlg .ft{display:flex;justify-content:flex-end;gap:.4rem;padding:.7rem 1rem;background:#F6F7F9;border-top:1px solid var(--rule)}
.check{display:none;padding:.6rem .8rem;border-top:1px solid var(--rule);max-height:16rem;overflow:auto}
.check.show{display:block}
.check ul{list-style:none;margin:0;padding:0;display:grid;gap:.3rem}
.check li{border-radius:6px;padding:.35rem .55rem;font-weight:600;font-size:.86rem}
.check li.ok{background:var(--ok-soft);color:#08533b}
.check li.warn{background:var(--warn-soft);color:#6b3d00}
.check li.no{background:var(--no-soft);color:#7a1d17}
/* SVG */
#chart .ins{cursor:pointer}
#chart .ins .plus{opacity:.22;transition:opacity .12s}
#chart .ins:hover .plus,#chart .ins:focus .plus{opacity:1}
#chart .node{cursor:pointer}
#printHead{display:none}
@media print{
  header.top,.tb,.runbar,.side,.hintbar,.selbar{display:none !important}
  .main{display:block}
  .chartWrap{background:none;overflow:visible}
  #printHead{display:block;margin:0 0 8px;font-family:Arial}
  #chart .plus{display:none}
  #chart{max-width:100%;height:auto}
}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <h1>Блок-схем зурагч <small>· 4-р анги · Хичээл 12</small></h1>
    <span class="sp"></span>
    <input id="title" maxlength="60" placeholder="Схемийн нэр" aria-label="Схемийн нэр">
    <input id="author" maxlength="40" placeholder="Миний нэр" aria-label="Миний нэр" style="width:9rem">
  </header>
  <div class="tb" role="toolbar" aria-label="Хэрэгслүүд">
    <select id="tpl" aria-label="Загвар">
      <option value="">📂 Загвар нээх…</option>
      <optgroup label="Хичээл 12 · Блок-схем">
        <option value="out">🌧 Гадаа гарах уу?</option>
        <option value="book">📚 Ном авах уу? (2 шийдвэр)</option>
        <option value="teeth">🪥 Шүдээ угаах</option>
      </optgroup>
      <optgroup label="Хичээл 14–15 · Давталт">
        <option value="square">🟦 Дөрвөлжин зурах (4 удаа давт)</option>
        <option value="wall">🧱 Хана мөргөх хүртэл алх</option>
        <option value="stars">⭐ 3 мөр × 4 од (үүрлэсэн)</option>
      </optgroup>
      <optgroup label="Хичээл 16 · Хувьсагч">
        <option value="score">🎯 Оноо тоолох</option>
      </optgroup>
      <option value="empty">⬜ Шинэ хоосон схем</option>
    </select>
    <button class="b" id="bUndo" type="button" title="Буцаах (⌘Z / Ctrl+Z)">↶ Буцаах</button>
    <span class="sep"></span>
    <button class="b run" id="bRun" type="button" title="Ажиллуулах">▶ Ажиллуулах</button>
    <button class="b" id="bStep" type="button" title="Алхам алхмаар">⏯ Алхамаар</button>
    <button class="b pri" id="bCheck" type="button">✓ Шалгах</button>
    <span class="sp"></span>
    <button class="b" id="zOut" type="button" aria-label="Жижигрүүлэх">−</button>
    <span id="zLbl" style="font-weight:700;font-size:.85rem;min-width:3rem;text-align:center">100%</span>
    <button class="b" id="zIn" type="button" aria-label="Томруулах">+</button>
    <span class="sep"></span>
    <button class="b" id="bPng" type="button">⬇ PNG</button>
    <button class="b" id="bPrint" type="button">🖨 Хэвлэх</button>
  </div>
  <div class="runbar" id="runbar" role="status">
    <span class="msg" id="runMsg"></span>
    <span id="runBtns" style="display:flex;gap:.35rem;flex-wrap:wrap"></span>
    <button class="b" id="runAuto" type="button">⏩ Автомат</button>
    <button class="b stop" id="runStop" type="button">■ Зогсоох</button>
  </div>
  <div class="hintbar">💡 <b>Сум</b> дээр дарж шинэ блок нэм · Блок дээр <b>2 дарж</b> засна · Сонгоод <b>Delete</b> дарж устгана · Шийдвэр: <b>Үгүй</b> зүүн, <b>Тийм</b> баруун.</div>
  <div class="main">
    <div class="chartWrap" id="wrap">
      <div class="selbar" id="selbar">
        <button class="b" id="sEdit" type="button">✎ Засах</button>
        <button class="b" id="sUp" type="button" aria-label="Дээш зөөх">↑</button>
        <button class="b" id="sDown" type="button" aria-label="Доош зөөх">↓</button>
        <button class="b stop" id="sDel" type="button">🗑 Устгах</button>
      </div>
      <div id="printHead"></div>
      <svg id="chart" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Блок-схем"></svg>
    </div>
    <aside class="side">
      <h2>Консол</h2>
      <div class="console" id="console" aria-live="polite"><div class="bub sys">«▶ Ажиллуулах» дарахад үр дүн энд гарна.</div></div>
      <form class="cin" id="cin"><input id="cinVal" autocomplete="off" aria-label="Утга оруулах"><button class="b pri" type="submit">Оруулах</button></form>
      <h2>Хувьсагчид</h2>
      <div class="vars"><table><thead><tr><th>Нэр</th><th>Утга</th></tr></thead><tbody id="vars"><tr><td colspan="2" style="color:#8a90a0">—</td></tr></tbody></table></div>
      <div class="check" id="check" aria-live="polite"></div>
    </aside>
  </div>
</div>

<div class="palette" id="palette" role="menu" aria-label="Блок нэмэх"></div>
<div class="dlg" id="dlg" role="dialog" aria-modal="true">
  <form class="box" id="dlgForm">
    <div class="hd" id="dlgHd"></div>
    <div class="bd">
      <label for="dlgIn" id="dlgLbl"></label>
      <input id="dlgIn" maxlength="60" autocomplete="off">
      <p class="help" id="dlgHelp"></p>
      <div class="ex" id="dlgEx"></div>
    </div>
    <div class="ft"><button class="b" type="button" id="dlgCancel">Болих</button><button class="b pri" type="submit">OK</button></div>
  </form>
</div>

<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const NS = 'http://www.w3.org/2000/svg';

/* ───────────── Блокийн төрлүүд (Flowgorithm) ───────────── */
const TYPES = {
  assign: {name:'Үйлдэл', kw:'', fill:'#FFF7B5', shape:'rect', grp:'Хичээл 12 · 16',
           lbl:'Юу хийх вэ? (нэг алхам)', ph:'Шүхэр ав', help:'Нэг үйлдэл бич. Хувьсагчийн утгыг өөрчлөх бол: оноо = 0, оноо = оноо + 1', ex:['Цонхоор хар','Шүхэр ав','100 алх','90° эргэ','оноо = 0','оноо = оноо + 1']},
  if:     {name:'Шийдвэр', kw:'', fill:'#FFDDB0', shape:'diamond', grp:'Хичээл 12 · 16',
           lbl:'Тийм / үгүй гэж хариулах асуулт', ph:'Бороо орж байна уу?', help:'Тийм бол БАРУУН, Үгүй бол ЗҮҮН салаагаар явна. Харьцуулж болно: оноо > 10', ex:['Бороо орж байна уу?','Унших цаг байна уу?','оноо > 10']},
  output: {name:'Гаралт', kw:'Гаралт', fill:'#C9F2C2', shape:'para', grp:'Хичээл 16 · 18',
           lbl:'Дэлгэцэнд юу хэлэх (гэх) вэ?', ph:'"Хожлоо!"', help:'Текстийг хашилтад бич. Хувьсагчийн утгыг харуулах бол нэрийг нь бич: оноо. Нийлүүлэх бол &: "Оноо: " & оноо', ex:['"Хожлоо!"','оноо','"Оноо: " & оноо']},
  repeat: {name:'N удаа давт', kw:'', fill:'#FFD3E1', shape:'hex', grp:'Хичээл 14 · 15',
           lbl:'Хэдэн удаа давтах вэ?', ph:'4 удаа', help:'Тоог өмнөөс мэдэж байвал. Жишээ: дөрвөлжин зурахад «4 удаа давт: 100 алх, 90° эргэ».', ex:['4 удаа','3 удаа','10 удаа']},
  until:  {name:'Хүртэл давт', kw:'', fill:'#FFD3E1', shape:'hex', grp:'Хичээл 14 · 15',
           lbl:'Юу болох хүртэл давтах вэ? (зогсох нөхцөл)', ph:'Хана мөргөв үү?', help:'Хэдэн удаа гэдгийг мэдэхгүй ч ЗОГСОХ нөхцөл тодорхой бол. Үгүй бол дахин давтана, Тийм бол гарна.', ex:['Хана мөргөв үү?','Сагс дүүрэв үү?','оноо >= 10']}
};
const ORDER = ['assign','if','output','repeat','until'];
const LOOPLAB = {repeat:['Дахин','Дууссан'], until:['Үгүй','Тийм']};

let uid = 1;
const N = (type, text='', extra={}) => Object.assign({id:uid++, type, text}, type === 'if' ? {yes:[], no:[]} : (['repeat','until'].includes(type) ? {body:[]} : {}), extra);
const TEMPLATES = {
  out:   {title:'Гадаа гарах уу?', flow:() => [N('assign','Цонхоор хар'), N('if','Бороо орж байна уу?', {yes:[N('assign','Шүхэр ав')], no:[N('assign','Малгай ав')]}), N('assign','Гадаа гар')]},
  book:  {title:'Хичээлийн дараа ном авах уу?', flow:() => [N('assign','Номын санд оч'), N('if','Унших цаг байна уу?', {yes:[N('if','Сонирхсон ном байна уу?', {yes:[N('assign','Номоо бүртгүүлж ав')], no:[N('assign','Багшаас зөвлөгөө ав')]})], no:[N('assign','Дараа өдөр ирнэ')]}), N('assign','Гэртээ харь')]},
  teeth: {title:'Шүдээ угаах', flow:() => [N('assign','Сойзоо ав'), N('assign','Сойзон дээр оо түрх'), N('assign','Шүдээ 2 минут сойздо'), N('assign','Амаа зайл'), N('assign','Сойзоо угааж тавь')]},
  square:{title:'Дөрвөлжин зурах', flow:() => [N('assign','Бал буулга'), N('repeat','4 удаа', {body:[N('assign','100 алх'), N('assign','90° эргэ')]}), N('assign','Бал өргө')]},
  wall:  {title:'Хана мөргөх хүртэл алх', flow:() => [N('until','Хана мөргөв үү?', {body:[N('assign','1 алх')]}), N('output','"Хана!"')]},
  stars: {title:'3 мөр × 4 од', flow:() => [N('repeat','3 удаа', {body:[N('repeat','4 удаа', {body:[N('assign','Од зур'), N('assign','Баруун тийш зөө')]}), N('assign','Мөр сол')]})]},
  score: {title:'Оноо тоолох', flow:() => [N('assign','оноо = 0'), N('repeat','3 удаа', {body:[N('assign','оноо = оноо + 1'), N('output','"Оноо: " & оноо')]}), N('if','оноо > 2', {yes:[N('output','"Хожлоо!"')], no:[N('output','"Дахин туршъя"')]})]},
  empty: {title:'', flow:() => []}
};

/* ───────────── Төлөв, хадгалалт, буцаах ───────────── */
let doc = {title:'', author:'', flow:[]};
let sel = null, zoom = 1;
const undoStack = [];
function snapshot(){ undoStack.push(JSON.stringify(doc)); if (undoStack.length > 60) undoStack.shift(); $('bUndo').disabled = false; }
function reid(list){ (list || []).forEach(n => { n.id = uid++; ['yes','no','body'].forEach(k => n[k] && reid(n[k])); }); return list; }
function save(){ try { localStorage.setItem('h4fc', JSON.stringify(doc)); } catch(e){} }
function load(){
  try { const s = JSON.parse(localStorage.getItem('h4fc') || 'null'); if (s && Array.isArray(s.flow)){ doc = s; reid(doc.flow); return; } } catch(e){}
  doc = {title:TEMPLATES.out.title, author:'', flow:TEMPLATES.out.flow()};
}
function changed(){ save(); draw(); $('check').classList.remove('show'); }
function find(id, list=doc.flow){
  for (let i=0;i<list.length;i++){
    const n = list[i]; if (n.id === id) return {list, i, n};
    for (const k of ['yes','no','body']) if (n[k]){ const r = find(id, n[k]); if (r) return r; }
  }
  return null;
}

/* ───────────── Хэмжээ ───────────── */
const G = 30, LH = 17, FS = 13.5;
const FONT = `${FS}px Arial,Helvetica,sans-serif`, FONTB = `bold ${FS}px Arial,Helvetica,sans-serif`;
const mctx = document.createElement('canvas').getContext('2d');
function tw(t, bold){ mctx.font = bold ? FONTB : FONT; return mctx.measureText(t).width; }
function wrap(text, maxW){
  const words = String(text || '').trim().split(/\s+/).filter(Boolean);
  if (!words.length) return [''];
  const lines = []; let cur = '';
  for (const w of words){ const t = cur ? cur + ' ' + w : w; if (tw(t, true) > maxW && cur){ lines.push(cur); cur = w; } else cur = t; }
  if (cur) lines.push(cur);
  return lines;
}
function label(n){ const T = TYPES[n.type]; const t = n.text.trim() || '…'; return T.kw ? T.kw + ' ' + t : t; }
function measureList(list){
  let l = 12, r = 12, h = G;
  list.forEach(n => { measureNode(n); l = Math.max(l, n._l); r = Math.max(r, n._r); h += n._h + G; });
  return {l, r, h};
}
function measureNode(n){
  const T = TYPES[n.type];
  const lines = wrap(label(n), T.shape === 'diamond' ? 150 : 190);
  const w0 = Math.max(...lines.map(x => tw(x, true)));
  n._lines = lines;
  if (T.shape === 'diamond'){
    n._w = Math.max(130, w0 * 1.45 + 46); n._dh = Math.max(54, lines.length * LH * 1.35 + 28);
    const L = measureList(n.no), R = measureList(n.yes);
    n._lx = -Math.max(n._w/2 + 16, L.r + 16); n._rx = Math.max(n._w/2 + 16, R.l + 16);
    n._L = L; n._R = R;
    n._l = Math.max(n._w/2, -n._lx + L.l); n._r = Math.max(n._w/2, n._rx + R.r);
    n._h = Math.max(n._dh + 12, n._dh/2 + Math.max(L.h, R.h) + 10);
    return;
  }
  if (T.shape === 'hex'){

/* ───────────── Илэрхийлэл тооцоолох ───────────── */
let vars = {};
const IDENT = '[A-Za-zА-Яа-яЁёӨөҮү_][A-Za-z0-9А-Яа-яЁёӨөҮү_]*';
function evalExpr(src, cond){
  const re = new RegExp(`\\s*("[^"]*"|\\d+(?:\\.\\d+)?|${IDENT}|>=|<=|==|!=|<>|&&|\\|\\||[-+*/%()<>=&!])`, 'y');

  while (pos < src.length){
    re.lastIndex = pos; const m = re.exec(src);
    if (!m) return undefined;
    pos = re.lastIndex; const t = m[1];
    if (/^"/.test(t)) out += JSON.stringify(t.slice(1, -1));
    else if (/^\d/.test(t)) out += t;
    else if (new RegExp('^' + IDENT + '$').test(t)){
      const low = t.toLowerCase();
      if (low === 'and' || low === 'ба') out += '&&';
      else if (low === 'or' || low === 'эсвэл') out += '||';
      else if (low === 'not') out += '!';
      else if (Object.prototype.hasOwnProperty.call(vars, t)) out += JSON.stringify(vars[t]);
      else return undefined;
    }
    else if (t === '='){ if (!cond) return undefined; out += '=='; }
    else if (t === '<>') out += '!=';
    else if (t === '&') out += '+';
    else out += t;
    out += ' ';
  }

}

  if (/["&]/.test(s) || Object.prototype.hasOwnProperty.call(vars, s)){ const v = evalExpr(s, false); if (v !== undefined) return String(v); }

/* ───────────── Ажиллуулах ───────────── */
let run = null, curId = null, autoT = null, steps = 0;
function* exec(list){

    } else if (n.type === 'assign'){
      const m = t.match(new RegExp(`^(${IDENT})\\s*=\\s*(.+)$`));
      let msg = t;
      if (m){ const v = evalExpr(m[2], false); if (v !== undefined){ vars[m[1]] = v; msg = `${m[1]} = ${JSON.stringify(v)}`; } }
      yield {n, msg};
    } else if (n.type === 'if'){
      const c = yield* cond(n);
      yield* exec(c ? n.yes : n.no);
    } else if (n.type === 'repeat'){
      const m = t.match(new RegExp(`^(\\d+|${IDENT})`));
      let k = m ? (/^\d/.test(m[1]) ? +m[1] : evalExpr(m[1], false)) : undefined;
      if (typeof k !== 'number'){ yield {n, msg:'⚠ Хэдэн удаа давтахыг тоогоор бич (жишээ: 4 удаа)'}; k = 0; }
      for (let i = 1; i <= k; i++){ yield {n, msg:`Давталт ${i} / ${k}`}; yield* exec(n.body); }
      yield {n, msg:`${k} удаа давтаж дууслаа`};
    } else if (n.type === 'until'){

    }
  }
}

  return yield {n, ask:true};
}
function* program(){ yield {id:'start', msg:'Програм эхэллээ'}; yield* exec(doc.flow); yield {id:'end', msg:'Програм дууслаа'}; }

}
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function paintRun(){

    else if (!(ng.classList.contains('node') && sel === +ng.dataset.id)){ s.setAttribute('stroke', STROKE); s.setAttribute('stroke-width', 1.5); }

}
function startRun(auto){

  run = {it:program(), auto:!!auto};

  $('runMsg').textContent = v.n ? `${TYPES[v.n.type].name}: ${v.msg || v.n.text}` : v.msg;
  mk('Дараах алхам ▶', 'pri', () => step());
  if (run.auto) autoT = setTimeout(() => step(), 650); else btns.firstChild.focus();
}
$('bRun').onclick = () => startRun(true);
$('bStep').onclick = () => startRun(false);
$('runStop').onclick = stopRun;
$('runAuto').onclick = () => { if (!run) return; run.auto = !run.auto; $('runAuto').textContent = run.auto ? '⏸ Түр зогсоох' : '⏩ Автомат'; if (run.auto && $('runBtns').querySelector('.pri')) step(); else clearTimeout(autoT); };

/* ───────────── Шалгах ───────────── */
function check(){
  stopRun();
  const it = [];
  let empties = 0, qAssign = 0, ifs = 0, loops = 0, weakIf = 0, emptyIf = 0, emptyLoop = 0, total = 0, badRep = 0, nested = 0;
  (function walk(list, depth){
    list.forEach(n => {
      total++; const t = n.text.trim();
      if (!t) empties++;
      if (n.type === 'assign' && /[?？]$/.test(t)) qAssign++;
      if (n.type === 'if'){ ifs++; if (t && !/[?？]$/.test(t) && !/[<>=]/.test(t)) weakIf++; if (!n.yes.length && !n.no.length) emptyIf++; walk(n.yes, depth); walk(n.no, depth); }
      if (n.body){ loops++; if (depth > 0) nested++; if (!n.body.length) emptyLoop++; if (n.type === 'repeat' && t && !/^\s*(\d+|[A-Za-zА-Яа-яЁёӨөҮү_])/.test(t)) badRep++; walk(n.body, depth + 1); }
    });
  })(doc.flow, 0);
  it.push(['ok', 'Эхлэл ба Төгсгөл байна — схем бүрд яг 2.']);
  if (!total) it.push(['no', 'Блок алга. Сум дээр дарж блок нэм.']);
  else it.push(['ok', `Нийт ${total} блок: ${ifs} шийдвэр (◇), ${loops} давталт (⬡).`]);
  if (empties) it.push(['no', `${empties} блок хоосон байна — 2 дарж бичвэр нэм.`]);
  if (qAssign) it.push(['no', `${qAssign} шар тэгш өнцөгт асуулт шиг бичигдсэн. Тийм/үгүй асуулт бол ◇ ШИЙДВЭР ашигла!`]);
  if (weakIf) it.push(['warn', `${weakIf} шийдвэрийн бичвэр асуулт биш байна («…уу?» эсвэл оноо > 10).`]);
  if (ifs) it.push(['ok', 'Шийдвэр бүрээс 2 зам гарсан: Тийм (баруун), Үгүй (зүүн).']);
  if (emptyIf) it.push(['warn', `${emptyIf} шийдвэрийн хоёр салаа хоосон байна. Тийм эсвэл үгүй бол юу хийх вэ?`]);
  if (emptyLoop) it.push(['warn', `${emptyLoop} давталтын дотор блок алга — юуг давтах вэ?`]);
  if (badRep) it.push(['warn', '«N удаа давт»-д хэдэн удаа гэдгийг тоогоор эхлүүлж бич (жишээ: 4 удаа).']);
  if (nested) it.push(['ok', `⭐ Үүрлэсэн давталт байна (${nested} давталт өөр давталтын дотор).`]);
  it.push(['ok', 'Бүх зам Төгсгөлд нийлсэн.']);
  const all = it.every(x => x[0] === 'ok');
  $('check').innerHTML = `<b style="display:block;margin-bottom:.4rem">${all ? '🎉 Схем бүрэн, зөв!' : '🔍 Шалгалтын дүн'}</b><ul>${it.map(([c, t]) => `<li class="${c}">${c === 'ok' ? '✓' : c === 'warn' ? '⚠' : '✕'} ${t}</li>`).join('')}</ul>`;
  $('check').classList.add('show'); $('check').scrollIntoView({block:'nearest', behavior:'smooth'});
}
$('bCheck').onclick = check;

/* ───────────── Загвар, нэр, экспорт ───────────── */
$('tpl').onchange = e => {
  const t = TEMPLATES[e.target.value]; e.target.value = ''; if (!t) return;
  stopRun(); snapshot();
  doc.flow = t.flow(); doc.title = t.title; $('title').value = doc.title; sel = null; changed();
};
$('title').oninput = e => { doc.title = e.target.value; save(); };
$('author').oninput = e => { doc.author = e.target.value; save(); };
$('zIn').onclick = () => { zoom = Math.min(2, +(zoom + .1).toFixed(2)); draw(); };
$('zOut').onclick = () => { zoom = Math.max(.4, +(zoom - .1).toFixed(2)); draw(); };
function exportSvg(){
  const c = svg.cloneNode(true);
  c.querySelectorAll('.plus').forEach(p => p.remove());
  const vb = svg.viewBox.baseVal; c.setAttribute('width', vb.width); c.setAttribute('height', vb.height);
  return {data:new XMLSerializer().serializeToString(c), w:vb.width, h:vb.height};
}
$('bPng').onclick = () => {
  stopRun(); const s = exportSvg(), scale = 2, head = 64;
  const img = new Image();
  img.onload = () => {
    const c = document.createElement('canvas'); c.width = s.w * scale; c.height = (s.h + head) * scale;
    const g = c.getContext('2d'); g.scale(scale, scale);
    g.fillStyle = '#fff'; g.fillRect(0, 0, s.w, s.h + head);
    g.textAlign = 'center'; g.fillStyle = '#1F2430'; g.font = 'bold 19px Arial'; g.fillText(doc.title || 'Блок-схем', s.w/2, 30);
    g.fillStyle = '#5C6278'; g.font = '13px Arial'; g.fillText((doc.author ? doc.author + ' · ' : '') + '4-р анги · Хичээл 12', s.w/2, 50);
    g.drawImage(img, 0, head, s.w, s.h);
    c.toBlob(b => { const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = ((doc.title || 'blok-skhem').replace(/[\\/:*?"<>|]+/g,'').trim() || 'blok-skhem') + '.png'; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 3000); }, 'image/png');
  };
  img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(s.data);
};
$('bPrint').onclick = () => {
  stopRun(); sel = null; paintSel();
  $('printHead').innerHTML = `<h2 style="margin:0">${esc(doc.title || 'Блок-схем')}</h2><div style="color:#5C6278">${esc(doc.author || '')} · 4-р анги · Хичээл 12</div>`;
  window.print();
};

buildPalette();
load();
$('title').value = doc.title || ''; $('author').value = doc.author || '';
draw();
window.__fc = {get doc(){ return doc; }, draw, check, startRun, step, openPalette, insPts:() => insPts, evalExpr, vars:() => vars};
})();
</script>
</body>
</html>
